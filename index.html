<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Divvy's Divisibility Rules</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: a sunny trip across 7 number stops. White "sticker" panels float on a sky; one screen per stop. Single light world by choice. */
:root{
  --sky:#B9E0FF; --sky-2:#E6F4FF; --ink:#1D2B4F; --ink-soft:#4E5C7C; --paper:#FFFFFF;
  --sun:#FFC83D; --sun-dark:#E39A10; --hill:#7ED48B; --hill-2:#5CBF6E; --yes:#1F9E55; --yes-soft:#DDF5E6;
  --no:#E8473D; --no-soft:#FFE4E1; --line:#D5E2F2; --shade:rgba(29,43,79,.13);
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Andika","Trebuchet MS",Verdana,sans-serif;
  --c:#1E90E8; --cd:#136BB0; --cs:#E3F2FD; --on:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky-2);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;overflow-x:hidden;min-height:100%}
.sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 75%);overflow:hidden;pointer-events:none}
.cloud{position:absolute;fill:var(--paper);opacity:.9;animation:drift 70s linear infinite alternate;will-change:transform}
.cloud.c2{animation-duration:95s;opacity:.75}.cloud.c3{animation-duration:120s;opacity:.6}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(120px)}}
h1,h2,h3,.display{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:14px}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- shared bits ---------- */
.btn{font-family:var(--display);font-weight:700;font-size:21px;line-height:1;padding:14px 24px 12px;border-radius:999px;
  background:var(--c);color:var(--on);box-shadow:0 5px 0 var(--cd);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--cd)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--shade)}
.btn.sun{--c:var(--sun);--cd:var(--sun-dark);--on:var(--ink)}
.panel{background:var(--paper);border-radius:28px;padding:22px 24px;box-shadow:0 6px 0 var(--shade);min-width:0}
.label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--cd)}
.ico{width:1em;height:1em;flex:none;vertical-align:-.12em}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px}
.top .wrap{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:999px;padding:8px 10px 8px 12px;box-shadow:0 4px 0 var(--shade)}
.home{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;padding:2px 10px 2px 2px;border-radius:999px}
.home svg{width:38px;height:38px}
.dots{display:flex;gap:6px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.dot{width:40px;height:40px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:17px;background:var(--sky-2);color:var(--ink-soft);position:relative;display:grid;place-items:center;transition:transform .15s}
.dot:hover{transform:translateY(-2px)}
.dot.on{background:var(--dc);color:var(--don);box-shadow:0 3px 0 var(--dcd)}
.dot .star{position:absolute;top:-6px;right:-6px;width:18px;height:18px}
.player{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink-soft);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.player b{color:var(--ink)}
.snd{width:42px;height:42px;border-radius:50%;background:var(--sky-2);display:grid;place-items:center}
.snd svg{width:24px;height:24px}

/* ---------- Divvy ---------- */
.divvy{display:block;overflow:visible;-webkit-tap-highlight-color:transparent}
main .divvy{cursor:pointer}
.divvy .dv-tilt{transform-origin:70px 146px}
.divvy .dv-body{transform-origin:70px 144px;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
.divvy .ant{transform-origin:70px 31px;animation:wobble 2.8s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.divvy .dv-eyes{transform-box:fill-box;transform-origin:center;transition:transform .07s ease-in,opacity .15s}
.divvy.blink .dv-eyes{transform:scaleY(.08)}
.divvy .dv-joy{opacity:0;transition:opacity .15s}
.divvy.joy .dv-joy{opacity:1}
.divvy.joy .dv-eyes{opacity:0}
.divvy .dv-brow{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.divvy[data-mood="think"] .dv-brow.l{transform:translateY(-3px) rotate(-8deg)}
.divvy[data-mood="oops"] .dv-brow.l{transform:translateY(-2px) rotate(-14deg)}
.divvy[data-mood="oops"] .dv-brow.r{transform:translateY(-2px) rotate(14deg)}
.divvy.joy .dv-brow{transform:translateY(-3px)}
.divvy .dv-cheek{opacity:.75;transition:opacity .3s}
.divvy.near .dv-cheek,.divvy.joy .dv-cheek{opacity:1}
.divvy .m{display:none}
.divvy[data-mood="happy"] .m-happy,.divvy[data-mood="cheer"] .m-cheer,.divvy[data-mood="oops"] .m-oops,.divvy[data-mood="think"] .m-think{display:inline}
.divvy[data-mood="cheer"] .arm-r{transform-origin:121px 94px;animation:wave .5s ease-in-out 3}
@keyframes wave{50%{transform:rotate(-35deg)}}
.bounce{animation:bounce .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(1.04,.96)}100%{transform:none}}
.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}50%{transform:translateX(6px) rotate(3deg)}75%{transform:translateX(-3px)}}
.bubble{position:relative;background:var(--paper);border-radius:22px;padding:14px 18px;font-size:18px;box-shadow:0 4px 0 var(--shade)}
.bubble::before{content:"";position:absolute;left:-12px;top:26px;border:12px solid transparent;border-right-color:var(--paper);border-left:0}

/* ---------- start screen ---------- */
.start{padding-block:28px 0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;align-items:center}
.hero .divvy{width:190px}
.title{font-size:clamp(46px,8.4vw,104px);letter-spacing:-.01em}
.title .w1{display:block;color:var(--ink)}
.title .w2{display:block}
.title .w2 span{display:inline-block;animation:hop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*70ms + .2s)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-18px)}100%{transform:none}}
.hero .bubble{margin-top:12px;max-width:560px}
.namebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
.namebox label{font-family:var(--display);font-weight:800;font-size:24px}
.namebox input{flex:1;min-width:0;max-width:440px;font-family:var(--display);font-weight:700;font-size:28px;padding:8px 18px;border-radius:18px;border:3px dashed var(--ink-soft);background:var(--paper)}
.namebox input:focus{border-style:solid;border-color:var(--ink);outline:none}
.map{position:relative;margin-top:30px;padding:28px 18px 120px;border-radius:36px;background:var(--paper);box-shadow:0 6px 0 var(--shade);overflow:hidden}
.map h2{font-size:30px;text-align:center}
.map .sub{text-align:center;color:var(--ink-soft);margin-top:4px}
.trail{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:22px;z-index:1}
.trail svg.path{position:absolute;left:6%;right:6%;top:30px;width:88%;height:110px;z-index:-1}
.stop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.stop:nth-child(even of .stop){margin-top:56px}
.stop .disc{width:92px;height:92px;border-radius:50%;background:var(--sc);color:var(--son);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:38px;box-shadow:0 6px 0 var(--scd);position:relative;transition:transform .15s}
.stop:hover .disc{transform:translateY(-5px) rotate(-4deg)}
.stop .disc .star{position:absolute;top:-6px;right:-4px;width:30px;height:30px}
.stop b{font-family:var(--display);font-size:17px;line-height:1.1}
.stop small{color:var(--ink-soft);font-size:14px;line-height:1.2}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px}
.cta{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:26px}

/* ---------- level screen ---------- */
.lvl{padding-block:8px 0}
.lhead{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.badge{width:118px;height:118px;flex:none;border-radius:34px;background:var(--c);color:var(--on);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:58px;box-shadow:0 7px 0 var(--cd);transform:rotate(-4deg)}
.badge span{font-size:.7em;margin-right:2px}
.lhead h1{font-size:clamp(38px,5.4vw,60px)}
.lhead h1 em{font-style:normal;color:var(--c)}
.lhead .nick{font-family:var(--display);font-weight:700;font-size:21px;color:var(--ink-soft)}
.lhead .earned{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;background:var(--paper);border-radius:999px;padding:8px 16px;box-shadow:0 4px 0 var(--shade)}
.lhead .earned svg{width:26px;height:26px}
.grid2{display:grid;grid-template-columns:1.08fr 1fr;gap:22px;margin-top:22px;align-items:start}
.col{display:grid;gap:22px;min-width:0}
.rule{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.2;margin-top:6px;text-wrap:pretty}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cs);color:var(--cd);font-style:normal;font-family:var(--display);font-weight:800;display:grid;place-items:center}

.lab{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}
.lab .divvy{width:104px}
.lab .tester{grid-column:1/-1}
.lab .bubble{background:var(--cs);box-shadow:none;min-height:92px;display:flex;align-items:center}
.lab .bubble::before{border-right-color:var(--cs)}
.tester{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tester input{width:132px;font-family:var(--display);font-weight:800;font-size:34px;text-align:center;letter-spacing:.06em;padding:4px 8px;border-radius:16px;border:3px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums}
.tester input:focus{border-color:var(--c);outline:none}
.tiles{display:flex;gap:10px;margin-top:6px;grid-column:1/-1;justify-content:center}
.tile{width:74px;height:86px;border-radius:20px;background:var(--sky-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:54px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s;font-variant-numeric:tabular-nums}
.tile.hl{background:var(--c);color:var(--on);transform:translateY(-8px)}
.tile.dim{opacity:.35}
.lines{grid-column:1/-1;list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;min-height:84px;align-content:start}
.lines li{display:flex;gap:10px;align-items:center;font-size:19px;line-height:1.3;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.lines li.show{opacity:1;transform:none}
.lines li svg{width:26px;height:26px}
.result{grid-column:1/-1;border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--sky-2);color:var(--ink-soft);transition:background-color .35s ease,color .35s ease}
.result.yes{background:var(--yes-soft);color:var(--yes)}
.result.no{background:var(--no-soft);color:var(--no)}
.result .ric{grid-row:span 2;width:34px;height:34px;display:grid;place-items:center}
.result .ric svg{width:34px;height:34px}
.result.yes .ric,.result.no .ric{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.result .verdict{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15}
.result .proof{font-weight:700;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;transition:opacity .35s ease}
.result.wait .proof{opacity:0}
.spin{animation:spin .9s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.tile.flip{animation:flip .4s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--k)*70ms)}
@keyframes flip{from{transform:rotateX(90deg)}}

.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.num{background:var(--cs);border-radius:20px;padding:12px 4px 10px;text-align:center;box-shadow:0 4px 0 var(--shade);transition:transform .15s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes pop{from{transform:scale(.8)}}
.num:hover{transform:translateY(-4px) rotate(-2deg)}
.num.picked{background:var(--c);color:var(--on)}
.num.picked small{color:var(--on)}
.num b{display:block;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.num small{display:block;color:var(--ink-soft);font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.hint{color:var(--ink-soft);font-size:16px;margin-top:4px}
.tip{display:flex;gap:14px;align-items:center;background:var(--paper);border:3px dashed var(--c);border-radius:24px;padding:14px 18px}
.tip svg{width:40px;height:40px;flex:none}

.quiz{position:relative;overflow:hidden}
.qrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px}
.qnum{font-family:var(--display);font-weight:800;font-size:60px;line-height:1;min-width:130px;font-variant-numeric:tabular-nums}
.qbtns{display:flex;gap:10px;margin-left:auto}
.btn.yes{--c:var(--yes);--cd:#167A41}
.btn.no{--c:var(--no);--cd:#B9332B}
.qmsg{margin-top:12px;min-height:54px;font-size:18px;line-height:1.4}
.qmsg svg{width:22px;height:22px}
.qact{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;visibility:hidden;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s,visibility 0s .3s}
.qact.show{visibility:visible;opacity:1;transform:none;transition:opacity .3s,transform .3s}
.qscore{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--ink-soft);font-size:16px}
.qscore svg{width:30px;height:30px}
.confetti{position:absolute;width:12px;height:16px;border-radius:3px;top:45%;left:50%;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}

/* ---------- machine ---------- */
.mach{display:grid;grid-template-columns:320px 1fr;gap:22px;margin-top:20px;align-items:start}
.screen{background:var(--ink);color:var(--sun);border-radius:22px;padding:12px;text-align:center;box-shadow:inset 0 0 0 6px #2E3F6B}
.screen input{width:100%;background:transparent;border:0;color:var(--sun);font-family:var(--display);font-weight:800;font-size:76px;text-align:center;letter-spacing:.08em;outline:none;font-variant-numeric:tabular-nums}
.mrows{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;background:var(--paper);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 var(--shade);transition:background .2s}
.mrow .mb{width:62px;height:52px;border-radius:16px;background:var(--rc);color:var(--ron);font-family:var(--display);font-weight:800;font-size:26px;display:grid;place-items:center}
.mrow .why{font-size:17px;min-width:0}
.mrow .why b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.lamp{width:110px;text-align:center;font-family:var(--display);font-weight:800;font-size:18px;border-radius:999px;padding:8px 0 6px;background:var(--sky-2);color:var(--ink-soft)}
.lamp.yes{background:var(--yes);color:var(--paper)}
.lamp.no{background:var(--no);color:var(--paper)}
.mrow.flash{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.msum{font-family:var(--display);font-weight:800;font-size:26px;margin-top:6px;min-height:68px;line-height:1.25}
.mrow .why span{display:block;transition:opacity .25s}
.mrow.wait .why span{opacity:.35}

[hidden]{display:none!important}

@media (max-width:980px){
  .grid2,.mach{grid-template-columns:1fr}
  .trail{grid-template-columns:repeat(4,1fr);row-gap:22px}
  .trail svg.path{display:none}
  .stop:nth-child(even of .stop){margin-top:0}
  .player{display:none}
}
@media (max-width:640px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr;text-align:left}
  .hero .divvy{width:120px}
  .nums{grid-template-columns:repeat(2,1fr)}
  .trail{grid-template-columns:repeat(2,1fr)}
  .dots{display:none}
  .home span{display:none}
  .badge{width:90px;height:90px;font-size:44px;border-radius:26px}
  .lhead .earned{margin-left:0}
  .qbtns{margin-left:0}
  .lab .divvy{width:72px}
    .mrow{grid-template-columns:52px 1fr}.lamp{grid-column:1/-1;width:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="sky" aria-hidden="true">
  <svg class="cloud" style="top:70px;left:4%" width="170" height="70" viewBox="0 0 170 70"><path d="M20 62h128a20 20 0 0 0 2-40 30 30 0 0 0-56-10 24 24 0 0 0-42 12A20 20 0 0 0 20 62z"/></svg>
  <svg class="cloud c2" style="top:220px;right:8%" width="210" height="80" viewBox="0 0 170 70"><path d="M20 62h128a20 20 0 0 0 2-40 30 30 0 0 0-56-10 24 24 0 0 0-42 12A20 20 0 0 0 20 62z"/></svg>
  <svg class="cloud c3" style="top:480px;left:40%" width="140" height="56" viewBox="0 0 170 70"><path d="M20 62h128a20 20 0 0 0 2-40 30 30 0 0 0-56-10 24 24 0 0 0-42 12A20 20 0 0 0 20 62z"/></svg>
</div>

<header class="top" id="top" hidden>
  <div class="wrap">
    <a class="home" href="#start" aria-label="Back to the map"><span>Divisibility Rules</span></a>
    <nav class="dots" id="dots" aria-label="Levels"></nav>
    <div class="player" id="player"></div>
    <button class="snd" id="snd" aria-label="Sound on" title="Sound"></button>
  </div>
</header>

<main id="app"></main>

<script>
(() => {
const LEVELS = [
 {n:2, c:"#1E90E8", cd:"#136BB0", cs:"#E1F0FD", on:"#fff", nick:"The Even Check",
  rule:"A number is divisible by 2 if its last digit is even: 0, 2, 4, 6, or 8.",
  steps:["Look only at the last digit (the ones place).","If it is 0, 2, 4, 6, or 8, the number is divisible by 2."],
  tip:"Only five last digits win: 0, 2, 4, 6, and 8. Any number that ends in an odd digit is out.",
  tryN:738, nums:[158,274,396,418,536,652,738,874,916,994]},
 {n:3, c:"#8B5CF6", cd:"#6A3FD0", cs:"#EEE7FF", on:"#fff", nick:"The Digit Sum",
  rule:"A number is divisible by 3 if the sum of its digits is divisible by 3.",
  steps:["Add up all the digits.","If that sum is in the 3 times table (3, 6, 9, 12, 15, 18, 21...), so is the number."],
  tip:"Sum still too big? Add its digits again: 975 → 9 + 7 + 5 = 21 → 2 + 1 = 3.",
  tryN:483, nums:[159,261,357,483,528,645,729,807,912,975]},
 {n:4, c:"#26A85A", cd:"#1A7F43", cs:"#E0F5E8", on:"#fff", nick:"The Last Two",
  rule:"A number is divisible by 4 if its last two digits make a number divisible by 4.",
  steps:["Cover the hundreds digit. Read the last two digits as one number.","If that number is in the 4 times table, the whole number is too."],
  tip:"Why only two digits? Every hundred (100, 200, 300...) splits evenly into 4s, so the hundreds never matter.",
  tryN:748, nums:[192,228,316,352,472,584,636,748,856,964]},

let ac, bus, verb, noiseBuf;
function audioReady(){
  if (!soundOn) return false;
  try {
    if (!ac){
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .25;
      bus = ac.createGain(); bus.gain.value = .9;
      bus.connect(comp).connect(ac.destination);
      const len = ac.sampleRate * 1.6 | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
      const conv = ac.createConvolver(), damp = ac.createBiquadFilter();
      conv.buffer = ir; damp.type = "lowpass"; damp.frequency.value = 4200;
      verb = ac.createGain(); verb.gain.value = .28;
      verb.connect(conv).connect(damp).connect(bus);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    }
    if (ac.state === "suspended") ac.resume();

  } catch { return false; }
}
function voice({f, t = 0, type = "sine", vol = .1, a = .004, d = .4, bend = 0, lp = 0, pan = 0, wet = .3}){

  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + a);
  g.gain.exponentialRampToValueAtTime(.0001, at + a + d);
  let n = osc.connect(g);
  if (lp){ const fl = ac.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; n = n.connect(fl); }
  if (pan && ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = pan; n = n.connect(p); }
  n.connect(bus);

}

/* ---------- Divvy's eyes: follow the pointer, blink, glance around when idle ---------- */
const look = {x: 0, y: 0, moved: -1e9, active: false};
const onPointer = e => { look.x = e.clientX; look.y = e.clientY; look.moved = performance.now(); look.active = true; };
addEventListener("pointermove", onPointer, {passive: true});
addEventListener("pointerdown", onPointer, {passive: true});
document.addEventListener("mouseout", e => { if (!e.relatedTarget) look.active = false; });
const eyeState = new WeakMap();
let lastFrame = 0;
function eyesLoop(t){
  const dt = Math.min(.05, (t - lastFrame) / 1000 || .016); lastFrame = t;
  const k = 1 - Math.exp(-dt * 9);
  const idle = t - look.moved;
  const ae = document.activeElement, focus = ae && ae.tagName === "INPUT" ? ae : null;
  for (const svg of document.querySelectorAll(".divvy")){
    let s = eyeState.get(svg);
    if (!s){
      s = {x: 0, y: 0, gx: 0, gy: 0, gUntil: 0, blink: t + rnd(1200, 3500),
        pupils: svg.querySelectorAll(".dv-pupil"), shines: svg.querySelectorAll(".dv-shine"),
        face: svg.querySelector(".dv-face"), tilt: svg.querySelector(".dv-tilt")};
      eyeState.set(svg, s);
    }
    const r = svg.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > innerHeight) continue;
    const sc = Math.min(r.width / 140, r.height / 160);
    const cx = r.left + r.width / 2, cy = r.top + (r.height - 160 * sc) / 2 + 72 * sc;
    let tx = 0, ty = 0, px = null, py = null;
    if (focus && idle > 800){ const fr = focus.getBoundingClientRect(); px = fr.left + fr.width / 2; py = fr.top + fr.height / 2; }
    else if (look.active && idle < 8000){ px = look.x; py = look.y; }
    if (px != null){
      const dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy) || 1, f = d / (d + 60 * sc + 50);
      tx = dx / d * f; ty = dy / d * f;
    } else if (!reduced){
      if (t > s.gUntil){
        const g = Math.random() < .4;
        s.gx = g ? rnd(-.8, .8) : 0; s.gy = g ? rnd(-.4, .3) : 0; s.gUntil = t + rnd(1400, 4000);
      }
      tx = s.gx; ty = s.gy;
    }
    if (svg.dataset.mood === "think"){ tx = tx * .3 - .5; ty = ty * .3 - .7; }
    s.x += (tx - s.x) * k; s.y += (ty - s.y) * k;
    const pX = (s.x * 3.8).toFixed(2), pY = (s.y * 3.4).toFixed(2);
    s.pupils.forEach(p => p.setAttribute("transform", `translate(${pX} ${pY})`));
    s.shines.forEach(p => p.setAttribute("transform", `translate(${(s.x * 1.5).toFixed(2)} ${(s.y * 1.3).toFixed(2)})`));
    s.face.setAttribute("transform", `translate(${(s.x * 2.4).toFixed(2)} ${(s.y * 1.8).toFixed(2)})`);
    if (!reduced) s.tilt.style.transform = `rotate(${(s.x * 3.5).toFixed(2)}deg)`;
    svg.classList.toggle("near", look.active && px === look.x && look.x > r.left && look.x < r.right && look.y > r.top && look.y < r.bottom);
    if (t > s.blink){
      svg.classList.add("blink");
      setTimeout(() => svg.classList.remove("blink"), 120);
      s.blink = t + (Math.random() < .2 ? 260 : rnd(2200, 6000));
    }
  }
  requestAnimationFrame(eyesLoop);
}

/* ---------- the math ---------- */
const digits = x => String(x).split("").map(Number);
const sumStr = d => d.join(" + ");
function check(n, x){
  const d = digits(x), last = d[2], sum = d[0] + d[1] + d[2], two = d[1] * 10 + d[2];
  const tt = (k, v) => v % k === 0 ? `Yes! ${k} × ${v / k} = ${v}` : `No, ${v} is not in the ${k} times table.`;
  let lines = [], hl = [0, 1, 2];
  if (n === 2){ hl = [2]; lines = [[null, `The last digit is <b>${last}</b>.`], [last % 2 === 0, `Is ${last} even? ${last % 2 === 0 ? "Yes!" : "No, it is odd."}`]]; }
  if (n === 5){ hl = [2]; lines = [[null, `The last digit is <b>${last}</b>.`], [last % 5 === 0, `Is it a 5 or a 0? ${last % 5 === 0 ? "Yes!" : "No."}`]]; }
  if (n === 10){ hl = [2]; lines = [[null, `The last digit is <b>${last}</b>.`], [last === 0, `Is it a 0? ${last === 0 ? "Yes!" : "No."}`]]; }
  if (n === 4){ hl = [1, 2]; lines = [[null, `The last two digits make <b>${two}</b>.`], [two % 4 === 0, tt(4, two)]]; }
  if (n === 3 || n === 9){ lines = [[null, `Add the digits: ${sumStr(d)} = <b>${sum}</b>.`], [sum % n === 0, tt(n, sum)]]; }
  if (n === 6){ lines = [[last % 2 === 0, `2 rule: last digit ${last} is ${last % 2 === 0 ? "even" : "odd"}.`], [sum % 3 === 0, `3 rule: ${sumStr(d)} = ${sum}. ${sum % 3 === 0 ? "In the 3 times table!" : "Not in the 3 times table."}`]]; }
  const pass = x % n === 0;
  const q = Math.floor(x / n), r = x % n;
  return {pass, hl, lines, proof: pass ? `${x} ÷ ${n} = ${q}` : `${x} ÷ ${n} = ${q} R ${r}`};
}
function why(n, x){ // one short line for the machine
  const d = digits(x), last = d[2], sum = d[0] + d[1] + d[2], two = d[1] * 10 + d[2];
  return {2:`Last digit ${last} is ${last % 2 ? "odd" : "even"}`, 3:`Digit sum ${sum}${sum % 3 ? " is not" : " is"} in the 3s`,
    4:`Last two digits ${two}${two % 4 ? " is not" : " is"} in the 4s`, 5:`Last digit is ${last}`,
    6:`${last % 2 ? "Odd" : "Even"}, and digit sum ${sum}${sum % 3 ? " is not" : " is"} in the 3s`,
    9:`Digit sum ${sum}${sum % 9 ? " is not" : " is"} in the 9s`, 10:`Last digit is ${last}`}[n];
}
const valid = v => /^\d{3}$/.test(v) && +v >= 100;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));

/* ---------- views ---------- */
const app = document.getElementById("app");
const lvlVars = l => `--c:${l.c};--cd:${l.cd};--cs:${l.cs};--on:${l.on}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function viewStart(){
  const letters = "Rules".split("").map((ch, i) => `<span style="--i:${i};color:${LEVELS[i].c}">${ch}</span>`).join("");
  const stopsHTML = LEVELS.map((l, i) => `<a class="stop" href="#level-${l.n}" style="--sc:${l.c};--scd:${l.cd};--son:${l.on}">
     <span class="disc">÷${l.n}${stars[l.n] ? I.star() : ""}</span><b>Level ${i + 1}</b><small>${l.nick}</small></a>`).join("");
  app.innerHTML = `<section class="start wrap">
   <div class="hero">
     ${divvy(190, "happy")}
     <div>
       <h1 class="title"><span class="w1">Divisibility</span><span class="w2">${letters}</span></h1>
       <div class="bubble">Hi, I'm <b>Divvy</b>! I can tell if a number splits evenly <b>without dividing</b>. Ride along with me through 7 levels and learn my shortcuts.</div>
     </div>
   </div>
   <div class="namebox"><label for="name-in">Explorer name:</label><input id="name-in" maxlength="30" placeholder="Type your name" value="${esc(name)}" autocomplete="off"></div>
   <div class="map">
     <h2>The Divisibility Trail</h2>
     <p class="sub">Each stop is one rule with 10 three-digit numbers that pass it. Win 3 quiz rounds at a stop to earn its star.</p>
     <div class="trail">
       <svg class="path" viewBox="0 0 880 110" preserveAspectRatio="none" aria-hidden="true"><path d="M10 30 C70 30 70 86 136 86 S200 30 268 30 S332 86 400 86 S466 30 532 30 S598 86 664 86 S730 30 800 30 S860 60 870 60" stroke="#C9D8EA" stroke-width="8" fill="none" stroke-dasharray="2 16" stroke-linecap="round"/></svg>
       ${stopsHTML}
     </div>
     <svg class="hills" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 Q150 10 320 60 T640 50 T960 40 T1200 60 V120 H0z" fill="#B7E8BF"/><path d="M0 95 Q200 50 420 90 T820 80 T1200 85 V120 H0z" fill="#7ED48B"/></svg>
   </div>
   <div class="cta">
     <a class="btn" href="#level-2" style="${lvlVars(LEVELS[0])}">Start the trip
       <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
     <a class="btn sun" href="#machine">Try the Number Machine</a>
   </div>
  </section>`;
  const inp = document.getElementById("name-in");
  inp.addEventListener("input", () => { name = inp.value.trim(); store.set("name", name); paintTop(); });
  const d = app.querySelector(".divvy");
  setTimeout(() => mood(d, "cheer"), reduced ? 0 : 500);
}

function viewLevel(l){
  const i = LEVELS.indexOf(l);
  const prev = ORDER[ORDER.indexOf("level-" + l.n) - 1], next = ORDER[ORDER.indexOf("level-" + l.n) + 1];
  const nextLabel = next === "machine" ? "Number Machine" : `Level ${i + 2}`;
  app.innerHTML = `<section class="lvl wrap" style="${lvlVars(l)}">
   <div class="lhead">
     <div class="badge"><span>÷</span>${l.n}</div>
     <div><div class="label">Level ${i + 1} of 7 · ${l.nick}</div><h1>Divisible by <em>${l.n}</em></h1></div>
     <div class="earned" id="earned"></div>
   </div>
   <div class="grid2">
     <div class="col">
       <div class="panel">
         <div class="label">The rule</div>
         <p class="rule">${l.rule}</p>
         <ol class="steps">${l.steps.map((s, k) => `<li><i>${k + 1}</i><span>${s}</span></li>`).join("")}</ol>
       </div>
       <div class="panel lab" aria-live="polite">
         ${divvy(104, "think")}
         <div class="bubble"><span id="say">Type any 3-digit number and I'll check it with the rule.</span></div>
         <div class="tester"><label class="label" for="test-in">Test a number</label>
           <input id="test-in" inputmode="numeric" maxlength="3" value="${l.tryN}" aria-label="Three-digit number to test">
           <button class="btn" id="test-go">Check it</button></div>
         <div class="tiles" id="tiles"></div>
         <ul class="lines" id="lines"></ul>
         <div id="result"></div>
       </div>
     </div>
     <div class="col">
       <div class="panel">
         <div class="label">10 numbers that pass</div>
         <div class="nums">${l.nums.map((x, k) => `<button class="num" style="--i:${k}" data-x="${x}" aria-label="Check ${x}"><b>${x}</b><small>${l.n} × ${x / l.n}</small></button>`).join("")}</div>
         <p class="hint">Tap a number to watch Divvy check it.</p>
       </div>
       <div class="tip">${I.bulb}<div><div class="label">Divvy's tip</div>${l.tip}</div></div>
       <div class="panel quiz" id="quiz"></div>
     </div>
   </div>
   <div class="pager">
     <a class="btn ghost" href="#${prev}">◀ ${prev === "start" ? "Map" : "Back"}</a>
     <a class="btn" href="#${next}">${nextLabel} ▶</a>
   </div>
  </section>`;

  const lab = app.querySelector(".lab"), dv = lab.querySelector(".divvy"), say = lab.querySelector("#say");
  const tiles = lab.querySelector("#tiles"), lines = lab.querySelector("#lines"), result = lab.querySelector("#result");
  const inp = lab.querySelector("#test-in");
  let run = 0;
  async function demo(x, animate = true){
    const me = ++run;
    const c = check(l.n, x);
    app.querySelectorAll(".num").forEach(b => b.classList.toggle("picked", +b.dataset.x === x));
    tiles.innerHTML = digits(x).map((d, k) => `<div class="tile${animate ? " flip" : ""}" style="--k:${k}">${d}</div>`).join("");
    lines.innerHTML = c.lines.map(([ok, html]) => `<li>${ok == null ? I.info : ok ? I.yes : I.no}<span>${html}</span></li>`).join("");
    const lis = [...lines.children];
    const light = () => tiles.querySelectorAll(".tile").forEach((t, k) => { t.classList.toggle("hl", c.hl.includes(k)); t.classList.toggle("dim", !c.hl.includes(k)); });
    const final = () => {
      result.className = "result " + (c.pass ? "yes" : "no");
      result.innerHTML = `<span class="ric">${c.pass ? I.yes : I.no}</span><span class="verdict">${c.pass ? `${x} IS divisible by ${l.n}!` : `${x} is NOT divisible by ${l.n}.`}</span><span class="proof">Proof: ${c.proof}</span>`;
      mood(dv, c.pass ? "cheer" : "oops");
      say.textContent = c.pass ? "It passes! No long division needed." : "Nope! The rule caught it, and the remainder proves it.";
    };
    if (!animate){ light(); lis.forEach(li => li.classList.add("show")); final(); return; }
    result.className = "result wait";
    result.innerHTML = `<span class="ric">${I.wait}</span><span class="verdict">Checking ${x}...</span><span class="proof">Proof: ${c.proof}</span>`;
    mood(dv, "think"); say.textContent = "Hmm, let me look...";
    await wait(450); if (me !== run) return;
    light(); sfx.tick(0);
    for (const [k, li] of lis.entries()){
      await wait(650); if (me !== run) return;
      li.classList.add("show"); sfx.tick(k + 2);
    }
    await wait(500); if (me !== run) return;
    final(); c.pass ? sfx.yes() : sfx.no();
  }
  function go(){
    const v = inp.value.trim();
    if (!valid(v)){ mood(dv, "oops"); sfx.no(); say.innerHTML = "I need a <b>3-digit</b> number, from 100 to 999. Try 482!"; return; }
    demo(+v);
  }
  lab.querySelector("#test-go").addEventListener("click", go);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 3); });
  app.querySelectorAll(".num").forEach(b => b.addEventListener("click", () => { inp.value = b.dataset.x; demo(+b.dataset.x); }));
  demo(l.tryN, false);
  say.innerHTML = `Here's how I check <b>${l.tryN}</b>. Tap <b>Check it</b> to watch, or tap a number.`;
  mood(dv, "happy");

  /* quiz */
  const quiz = app.querySelector("#quiz");
  let streak = 0, cur = 0, answered = false;
  function paintEarned(){
    app.querySelector("#earned").innerHTML = stars[l.n] ? `${I.star()} Star earned!` : `${I.star("#E6EDF6")} Star: win the quiz`;
  }
  function pick(){
    const want = Math.random() < .5;
    let x;
    do { x = 100 + Math.floor(Math.random() * 900); } while ((x % l.n === 0) !== want || x === cur);
    return x;
  }
  function round(){
    cur = pick(); answered = false;
    quiz.innerHTML = `<div class="label">Quiz time: 3 in a row wins a star</div>
      <div class="qrow"><div class="qnum">${cur}</div><div>Is it divisible by <b>${l.n}</b>?</div>
      <div class="qbtns"><button class="btn yes" data-a="1">Yes</button><button class="btn no" data-a="0">No</button></div></div>
      <div class="qmsg" id="qmsg">Tap Yes or No.</div>
      <div class="qscore">${[0,1,2].map(k => I.star(k < streak ? "#FFC83D" : "#E6EDF6")).join("")}<span>${streak} of 3</span></div>
      <div class="qact" id="qact"><button class="btn sun" id="qnext">Next number</button><button class="btn ghost" id="qwhy">Show me why</button></div>`;
    quiz.querySelector("#qnext").addEventListener("click", round);
    quiz.querySelector("#qwhy").addEventListener("click", () => { inp.value = cur; demo(cur); lab.scrollIntoView({behavior: reduced ? "auto" : "smooth", block: "center"}); });
    quiz.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => answer(b.dataset.a === "1")));
  }
  function answer(said){
    if (answered) return; answered = true;
    const truth = cur % l.n === 0, right = said === truth;
    streak = right ? streak + 1 : 0;
    const msg = quiz.querySelector("#qmsg");
    msg.innerHTML = `${right ? I.yes + " <b>Correct!</b>" : I.no + " <b>Not quite.</b>"} ${cur} ${truth ? "is" : "is not"} divisible by ${l.n}. ${why(l.n, cur)}.`;
    quiz.querySelector(".qscore").innerHTML = `${[0,1,2].map(k => I.star(k < streak ? "#FFC83D" : "#E6EDF6")).join("")}<span>${streak} of 3</span>`;
    if (right){ sfx.yes(); confetti(quiz); } else sfx.no();
    if (streak >= 3){
      stars[l.n] = true; store.set("stars", stars); paintEarned(); paintTop(); setTimeout(sfx.star, 450);
      msg.innerHTML += " <b>You earned the star!</b>";
      streak = 0;
    }
    const act = quiz.querySelector("#qact"); act.classList.add("show");
    quiz.querySelector("#qnext").focus({preventScroll: true});
  }
  paintEarned(); round();
}

function confetti(box){
  sfx.sparkle();
  if (reduced) return;
  const cols = LEVELS.map(l => l.c);
  for (let k = 0; k < 16; k++){
    const s = document.createElement("span");
    s.className = "confetti";
    const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 120;
    s.style.cssText = `background:${cols[k % cols.length]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r - 40}px;--r:${Math.random() * 540}deg`;
    box.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

function viewMachine(){
  const start = 840;
  app.innerHTML = `<section class="lvl wrap">
   <div class="lhead">
     ${divvy(110, "happy")}
     <div><div class="label" style="color:var(--ink-soft)">Bonus round</div><h1>The Number Machine</h1>
     <p style="max-width:560px;margin-top:6px">Feed it any 3-digit number. It runs all 7 rules at once and shows which ones pass.</p></div>
   </div>
   <div class="mach">
     <div class="panel">
       <div class="screen"><label class="label" for="m-in" style="color:#9FB1D9">Your number</label>
         <input id="m-in" inputmode="numeric" maxlength="3" value="${start}"></div>
       <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
         <button class="btn" id="m-go" style="--c:var(--ink);--cd:#0E1730">Run it</button>
         <button class="btn sun" id="m-rand">Surprise me</button>
       </div>
       <p class="msum" id="m-sum" aria-live="polite"></p>
     </div>
     <div class="mrows" id="m-rows">${LEVELS.map(l => `<div class="mrow" style="--rc:${l.c};--ron:${l.on}" data-n="${l.n}">
        <div class="mb">÷${l.n}</div><div class="why"><b>Divisible by ${l.n}?</b><span>Checking...</span></div><div class="lamp">...</div></div>`).join("")}</div>
   </div>
   <div class="pager"><a class="btn ghost" href="#level-10">◀ Back</a><a class="btn ghost" href="#start">Back to the map</a></div>
  </section>`;
  const inp = app.querySelector("#m-in"), sum = app.querySelector("#m-sum"), dv = app.querySelector(".divvy");
  let run = 0;
  async function machine(x, animate){
    const me = ++run;
    const rows = [...app.querySelectorAll(".mrow")];
    if (animate) rows.forEach(r => { r.classList.add("wait"); r.querySelector(".lamp").className = "lamp"; r.querySelector(".lamp").textContent = "..."; });
    sum.textContent = animate ? "Running..." : "";
    if (animate) mood(dv, "think");
    let passed = 0;
    for (const [k, r] of rows.entries()){
      const n = +r.dataset.n, ok = x % n === 0;
      if (animate){ await wait(260); if (me !== run) return; sfx.step(k, ok); }
      const lamp = r.querySelector(".lamp");
      lamp.className = "lamp " + (ok ? "yes" : "no"); lamp.textContent = ok ? "PASS" : "NO";
      r.querySelector(".why span").textContent = why(n, x) + (ok ? `, so ${x} ÷ ${n} = ${x / n}` : "");
      r.classList.remove("wait");
      r.classList.remove("flash"); void r.offsetWidth; if (animate) r.classList.add("flash");
      if (ok) passed++;
    }
    sum.innerHTML = `${x} passed <span style="color:var(--yes)">${passed} of 7</span> rules!`;
    if (animate){ mood(dv, passed ? "cheer" : "oops"); passed ? sfx.yes() : sfx.no(); }
  }
  function go(){
    const v = inp.value.trim();
    if (!valid(v)){ sum.textContent = "Type a 3-digit number, from 100 to 999."; mood(dv, "oops"); sfx.no(); return; }
    machine(+v, true);
  }
  app.querySelector("#m-go").addEventListener("click", go);
  app.querySelector("#m-rand").addEventListener("click", () => { inp.value = 100 + Math.floor(Math.random() * 900); go(); });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 3); });
  machine(start, false);
}

/* ---------- top bar ---------- */
const top = document.getElementById("top");
function paintTop(){
  const cur = location.hash.slice(1);
  document.getElementById("dots").innerHTML = LEVELS.map(l => `<a class="dot ${cur === "level-" + l.n ? "on" : ""}" href="#level-${l.n}" aria-label="Divisible by ${l.n}" style="--dc:${l.c};--dcd:${l.cd};--don:${l.on}">÷${l.n}${stars[l.n] ? I.star() : ""}</a>`).join("")
    + `<a class="dot ${cur === "machine" ? "on" : ""}" href="#machine" aria-label="Number Machine" style="--dc:#1D2B4F;--dcd:#0E1730;--don:#FFC83D">?</a>`;
  document.getElementById("player").innerHTML = name ? `Explorer: <b>${esc(name)}</b>` : "";
  const snd = document.getElementById("snd");
  snd.innerHTML = soundOn ? I.sndOn : I.sndOff;
  snd.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
}
document.getElementById("snd").addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); paintTop(); sfx.on(); });
app.addEventListener("click", e => {
  const d = e.target.closest(".divvy");
  if (!d) return;
  sfx.boop(); joy(d, 700);
  d.classList.remove("bounce", "shake"); void d.getBoundingClientRect(); d.classList.add("bounce");
});

/* ---------- router ---------- */
function route(){
  let h = location.hash.slice(1);
  if (!ORDER.includes(h)) h = "start";
  top.hidden = h === "start";
  if (h === "start") viewStart();
  else if (h === "machine") viewMachine();
  else viewLevel(LEVELS.find(l => "level-" + l.n === h));
  paintTop();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", () => { sfx.swish(); route(); });
addEventListener("keydown", e => {
  if (e.target.closest("input")) return;
  const i = ORDER.indexOf(location.hash.slice(1) || "start");
  if (e.key === "ArrowRight" && i < ORDER.length - 1) location.hash = ORDER[i + 1];
  if (e.key === "ArrowLeft" && i > 0) location.hash = ORDER[i - 1];
});
route();
requestAnimationFrame(eyesLoop);
})();
</script>
</body></html>
